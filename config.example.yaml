server:
  port: 3000
  env: "development"  # testing, development, production

ai:
  model: "gemini-2.5-flash" # your chosen Gemini model, e.g., "gemini-2.5-flash", "gemini-2.5-pro", etc.
  temperature: 0.7   # controls the randomness of the AI's responses, typically between 0 and 1
  maxRetries: 3   # number of times to retry a request to the AI in case of failure
  
secrets:
  geminiApiKey: "" # your Gemini API key, keep this secure and do not share it publicly